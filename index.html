<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimalist, Helium based dashboard.">
    <meta name="theme-color" content="#152671">

    <!-- CSP updated to allow fonts from Google -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; child-src 'none'; object-src 'none';">
    <title>Helium New Page</title>

    <!-- Imported Bebas Neue Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/three.min.js"></script>
</head>

<body class="flex flex-col h-screen select-none" style="cursor: default;">
<canvas id="gradient-shimmer" class="background" aria-hidden="true"></canvas>
<main class="flex-1 flex flex-col items-center justify-center px-6 relative z-10">
    <div class="mb-4 pointer-events-none select-none"
         style="animation: reveal3D var(--a-entrance) forwards; animation-delay: 0.1s; opacity: 0; perspective: 1200px;">
        <div class="canvas-3d-entrance">
            <canvas id="app-3d" class="opacity-95"></canvas>
        </div>
    </div>

    <div class="flex flex-col items-center text-center pointer-events-none select-none">
        <!-- Clock using Bebas Neue and adjusted sizing -->
        <h1 id="clock"
            class="text-[6rem] md:text-[7rem] font-normal tracking-tight mb-2 leading-none entrance-reveal"
            style="animation-delay: 0.2s;">00:00</h1>

        <!-- Date -->
        <p id="date" class="text-[1.15rem] md:text-[1.25rem] font-medium leading-relaxed max-w-xl entrance-reveal"
           style="animation-delay: 0.25s;">Monday, January 1</p>
    </div>
</main>
<script src="assets/js/gradient-shimmer.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
